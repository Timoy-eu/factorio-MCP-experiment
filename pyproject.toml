[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "factorio-agent-mcp"
version = "0.1.0"
description = "MCP server that lets small local LLMs play Factorio 2.0 through a few high level tools"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2"]

[project.optional-dependencies]
test = ["pytest", "lupa"]

[project.scripts]
factorio-agent-mcp = "factorio_agent_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
